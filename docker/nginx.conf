# ============================================================
# Rosetta 前端 nginx 配置
# ============================================================
# 前端为 Nuxt 4 (Nitro 服务器, node 监听 3000)
# - 所有页面/静态资源请求反代到 Nitro 服务器(node:3000)
# - /api/* 与 /media/* 反向代理到后端 FastAPI(backend:8000)
# 安全头必须逐 location include（snippets/rosetta-security.conf）：
# nginx 的 add_header 不继承，子 location 有自己的 add_header 时 server 层全部失效。
# ============================================================

upstream nitro {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/x-javascript
               application/json application/xml application/xml+rss
               image/svg+xml font/woff font/woff2;

    # 后端 API 反向代理
    location /api/ {
        include snippets/rosetta-security.conf;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖而非追加：客户端自带的 XFF 会伪造多跳，后端信任链必须只认这一跳
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 同源 SVG 的第二道防线：即使未来上传校验回退，也禁止脚本与外连
    location ~* ^/media/.*\.svg$ {
        include snippets/rosetta-security.conf;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 媒体文件反向代理
    location /media/ {
        include snippets/rosetta-security.conf;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 健康检查端点(直连 nginx)；容器 healthcheck 已改为直接探测 Nitro:3000
    location = /health {
        include snippets/rosetta-security.conf;
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # 其余所有请求（页面 + Nuxt 静态资源 /_nuxt/*）反代到 Nitro 服务器
    location / {
        include snippets/rosetta-security.conf;
        proxy_pass http://nitro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
