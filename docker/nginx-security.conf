# 每个 location 内 include，勿放在 server 层：
# nginx 的 add_header 不继承——子 location 一旦有自己的 add_header，
# server 层的全部安全头会一起失效（原 /media/ 的 Cache-Control 正踩了这个坑）。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# 说明：暂不启用强制 CSP。Nuxt payload 依赖内联脚本，直接写
# script-src 'self' 'unsafe-inline' 等于放弃 XSS 防护且会破坏水合；
# 应先上 Content-Security-Policy-Report-Only 收集违规，再配合 nonce 落地。
# 当前 XSS 防线由 lib/sanitize.ts 统一净化 + JSON-LD 输出编码承担。
