name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# 同一分支的连续推送只保留最新一次运行：前一次的结果已无意义，
# 排队堆积反而让"CI 是否绿"的判读变慢（每次 push 都要等一轮全量）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (FastAPI + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # 与 Dockerfile 的 python:3.12-slim 对齐（原 3.11 与运行时不一致）
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install backend dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen --extra dev

      - name: Lint backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check backend tests

      - name: Check backend formatting
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff format --check backend tests

      - name: Run backend tests
        env:
          # 测试使用独立临时 SQLite，不依赖外部服务。
          # 必须是 ENVIRONMENT（ROSETTA_ENV 从不被读取），且 Literal 只接受
          # development/staging/production，不能写 test。
          ENVIRONMENT: development
        # 去掉 --no-cov：否则 pyproject 的 fail_under=45 门禁完全不执行。
        run: uv run pytest -q

  frontend:
    name: Frontend typecheck, lint, test & build (Nuxt 4)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Nuxt types
        run: pnpm exec nuxi prepare

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Frontend unit tests
        run: pnpm test

      - name: Frontend build
        run: pnpm build
