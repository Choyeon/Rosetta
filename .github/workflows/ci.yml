name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend tests (FastAPI + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install backend dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --extra dev

      - name: Lint backend
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check backend tests

      - name: Check backend formatting
        # AGENTS §8.1 的三条后端门禁里，只有这一条没有自动化兜底：一旦没人跑，
        # 仓库会悄悄漂移到"人人都得在无关 PR 里顺手 reformat 27 个文件"。
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff format --check backend tests

      - name: Run backend tests
        env:
          # 测试使用独立临时 SQLite，不依赖外部服务
          ROSETTA_ENV: test
        run: |
          uv run pytest -q --no-cov

  frontend:
    name: Frontend typecheck & lint (Nuxt 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Nuxt types
        run: pnpm exec nuxi prepare

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
