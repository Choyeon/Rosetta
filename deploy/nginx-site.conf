upstream rosetta_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream rosetta_frontend {
    # Nuxt 4 (pnpm preview / node-server) 默认监听 3000；
    # 开发模式下 nuxt dev 默认 3000，如有需要再改。
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;
    # 真实部署时改成：server_name example.com www.example.com;
    # 一个 server 块挂多个域名时有三条硬约束，少一条就是静默故障：
    #   1) 同一块里的每个名字都必须在**同一张证书**的 SAN 里（certbot certonly --nginx
    #      --cert-name <首个域名> -d a -d b --force-renewal 可以扩 SAN 而不改证书路径）；
    #      否则后挂的名字会拿到域名不符的证书。
    #   2) certbot 在 80 端口留的是 `if ($host = 单个域名) { return 301 … }` + `return 404;`
    #      桩，多域名下其余名字会被 404 掉，必须改成无条件 `return 301 https://$host$request_uri;`。
    #   3) 后端 TrustedHostMiddleware 的白名单只从 settings.site_url 推导**一个** host，
    #      所以非规范域名必须在 nginx 层 301 走，不能指望它透传到 FastAPI。
    #   4) `listen [::]:443 ssl ipv6only=on` 整个文件里只能出现一次：第二处会
    #      `nginx -t: duplicate listen options for [::]:443`（配置直接起不来）。
    #      80 端口的 ACME location 必须排在 301 之前，否则续期拿不到校验文件。
    #   5) 规范域名收敛（如 www/blog → 裸域）要用**独立的 443 server 块**做 301，
    #      不能只改 80：浏览器先完成 TLS 握手才看 301，别名没有可信证书时用户只看到
    #      安全警告。别名块复用同一张多 SAN 证书即可。

    # 日志
    access_log /var/log/nginx/rosetta.access.log;
    error_log  /var/log/nginx/rosetta.error.log;

    # 大文件上传（媒体/头像等）
    client_max_body_size 50m;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json application/xml
               image/svg+xml font/woff font/woff2;

    # 安全头**不在这里声明**，全部写在下面反代 Nitro 的 location / 里（口径见该处注释）。
    # /api/ 与 /media/ 由 backend/core/security_middleware.py 自己发 6 个头。

    # ACME 挑战（Let's Encrypt 证书时使用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/_letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # ============================================================
    # /api, /media -> backend
    # ============================================================
    location /api/ {
        proxy_pass http://rosetta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    location /media/ {
        proxy_pass http://rosetta_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 健康检查
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================================
    # 其余 -> frontend (Nuxt 4 SSR / preview)
    # ============================================================
    location / {
        proxy_pass http://rosetta_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_hide_header X-Powered-By;

        # Nitro 自己不发任何安全响应头，这一层是 HTML（含 SSR 首屏）唯一的声明处。
        # 为什么写在 location 而不是 server：某个 location 一旦自己写了 add_header，
        # server 层的 add_header 全部不再作用于它；而 /api/ 与 /media/ 已经由
        # backend/core/security_middleware.py 发过 6 个头，nginx 再叠一遍会产出两条
        # CSP（浏览器按交集同时强制，等于两条都生效）与重复的 HSTS。
        # CSP 逐条对齐后端 _build_csp()，只把 nonce 换成 'unsafe-inline'：
        # Nitro 的 HTML 里有 3 段内联 script + 一个 <script type="importmap">，
        # 而 nonce 只有 FastAPI 中间件能注入，反代层拿不到。
        # 新增第三方源（字体/CDN/分析脚本）时两处要一起改，否则后台与前台策略分叉。
        # HSTS 只在 443 块有效：本块听 80，浏览器收到也不会记住，
        # 所以部署时这几行要连同 Strict-Transport-Security 一起复制进 443 的 location /
        # （见文件末尾 HTTPS 示例）。
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://www.googletagmanager.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; media-src 'self' blob: data:; connect-src 'self' https: wss: blob:; frame-src 'self' https://www.youtube-nocookie.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}

# ============================================================
# HTTPS 示例（推荐）— 用 certbot --nginx 自动签发，或手动配置：
#
# server {
#     listen 443 ssl http2;
#     server_name example.com;
#     ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     # ... 其他配置相同
#     #
#     # 上面 location / 里的 5 个安全头在这个块里同样要写一遍，并补上第 6 个：
#     # HSTS 只在 HTTPS 响应上有效，而生产上浏览器拿到 HTML 的正是 443 块，
#     # 只配 80 块等于"配了安全头但没人收到"。
#     #   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
#     # 口径与 backend/core/security_middleware.py::HSTS_HEADER 保持一致。
# }
# server {
#     listen 80; server_name example.com;
#     return 301 https://$host$request_uri;
# }
# ============================================================
