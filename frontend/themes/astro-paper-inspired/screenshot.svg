  <text x="260" y="214" font-family="Inter, 'PingFang SC', sans-serif" font-size="15" fill="#44403c">从项目结构到依赖注入，一份写给工程师的极简实践笔记。</text>
  <text x="260" y="238" font-family="Inter, 'PingFang SC', sans-serif" font-size="15" fill="#44403c">阅读更多</text>
  <line x1="260" y1="234" x2="318" y2="234" stroke="#1c1917" stroke-width="1"/>

  <!-- hairline 分隔的竖排列表 -->
  <line x1="260" y1="284" x2="1020" y2="284" stroke="#e7e5e4" stroke-width="1"/>
  <text x="260" y="336" font-family="Georgia, 'Songti SC', serif" font-size="24" font-weight="700" fill="#1c1917">Alembic 深度指南：数据库迁移与分支合并</text>
  <text x="260" y="364" font-family="Inter, 'PingFang SC', sans-serif" font-size="13" fill="#78716c">2026-09-03 · 12 分钟阅读 · #PostgreSQL #Docker</text>
