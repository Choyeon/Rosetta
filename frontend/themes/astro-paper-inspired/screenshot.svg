  <rect x="260" y="668" width="132" height="40" fill="#1c1917"/>
  <text x="292" y="693" font-family="Inter, 'PingFang SC', sans-serif" font-size="14" fill="#fafaf9">查看文章</text>

  <!-- 细线方角次按钮 -->
  <rect x="412" y="668" width="120" height="40" fill="none" stroke="#e7e5e4" stroke-width="1"/>
  <text x="444" y="693" font-family="Inter, 'PingFang SC', sans-serif" font-size="14" fill="#1c1917">订阅 RSS</text>

