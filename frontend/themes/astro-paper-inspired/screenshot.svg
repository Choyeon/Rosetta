  <line x1="0" y1="748" x2="1280" y2="748" stroke="#e7e5e4" stroke-width="1"/>
  <text x="640" y="778" text-anchor="middle" font-family="Inter, 'PingFang SC', sans-serif" font-size="13" fill="#78716c">© 2026 Rosetta · Built with the Minimal Paper theme.</text>
