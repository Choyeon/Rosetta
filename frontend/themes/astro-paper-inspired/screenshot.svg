<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-label="极简主题预览：760px 窄栏、衬线标题、hairline 细线、直角排版">
  <!-- 纸面底 -->
