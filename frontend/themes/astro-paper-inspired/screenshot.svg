  <!-- 列表条目标题：衬线大标题 -->
  <text x="260" y="150" font-family="Georgia, 'Songti SC', serif" font-size="30" font-weight="700" fill="#1c1917">快速上手 FastAPI：构建高性能 REST API</text>
