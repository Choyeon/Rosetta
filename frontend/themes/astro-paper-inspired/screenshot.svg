  <text x="260" y="452" font-family="Georgia, 'Songti SC', serif" font-size="24" font-weight="700" fill="#1c1917">PWA 离线应用实战：Service Worker 与 Background Sync</text>
  <text x="260" y="480" font-family="Inter, 'PingFang SC', sans-serif" font-size="13" fill="#78716c">2026-08-21 · 10 分钟阅读 · #前端 #JavaScript</text>
  <line x1="260" y1="516" x2="1020" y2="516" stroke="#e7e5e4" stroke-width="1"/>
  <text x="260" y="568" font-family="Georgia, 'Songti SC', serif" font-size="24" font-weight="700" fill="#1c1917">Zero Trust 安全架构入门：永不信任，始终验证</text>
